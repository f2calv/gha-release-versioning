name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      major: ${{ steps.versioning.outputs.major }}
      minor: ${{ steps.versioning.outputs.minor }}
      patch: ${{ steps.versioning.outputs.patch }}
      release-exists: ${{ steps.versioning.outputs.release-exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: versioning
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag-and-release: false

  test-gitversion:
    name: test (${{ matrix.gv-source }}, ${{ matrix.gv-config }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gv-source: [actions, dotnet, container]
        gv-config: ['.github/gitversion-v5.yml', 'GitVersion.yml']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: action
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          gv-source: ${{ matrix.gv-source }}
          gv-config: ${{ matrix.gv-config }}
          tag-and-release: false

      - name: assert outputs
        shell: bash
        run: |
          echo "version=${{ steps.action.outputs.version }}"
          echo "major=${{ steps.action.outputs.major }}"
          echo "minor=${{ steps.action.outputs.minor }}"
          echo "patch=${{ steps.action.outputs.patch }}"
          [[ -n "${{ steps.action.outputs.version }}" ]] || { echo "::error::version output is empty"; exit 1; }
          [[ -n "${{ steps.action.outputs.major }}" ]]   || { echo "::error::major output is empty";   exit 1; }
          [[ -n "${{ steps.action.outputs.minor }}" ]]   || { echo "::error::minor output is empty";   exit 1; }
          [[ -n "${{ steps.action.outputs.patch }}" ]]   || { echo "::error::patch output is empty";   exit 1; }

  test-manual-semver:
    name: test (manual semVer override)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: action
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          semVer: '2.3.4'
          tag-and-release: false

      - name: assert outputs
        shell: bash
        run: |
          echo "version=${{ steps.action.outputs.version }}"
          echo "major=${{ steps.action.outputs.major }}"
          echo "minor=${{ steps.action.outputs.minor }}"
          echo "patch=${{ steps.action.outputs.patch }}"
          [[ "${{ steps.action.outputs.version }}" == "2.3.4" ]] || { echo "::error::version should be 2.3.4, got '${{ steps.action.outputs.version }}'"; exit 1; }
          [[ "${{ steps.action.outputs.major }}"   == "2" ]]     || { echo "::error::major should be 2, got '${{ steps.action.outputs.major }}'";         exit 1; }
          [[ "${{ steps.action.outputs.minor }}"   == "3" ]]     || { echo "::error::minor should be 3, got '${{ steps.action.outputs.minor }}'";         exit 1; }
          [[ "${{ steps.action.outputs.patch }}"   == "4" ]]     || { echo "::error::patch should be 4, got '${{ steps.action.outputs.patch }}'";         exit 1; }

  validate:
    needs: [versioning]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: README floating major tag
        env:
          EXPECTED_ACTION_REF: ${{ github.repository }}@v${{ needs.versioning.outputs.major }}
        run: |
          awk -v ref="$EXPECTED_ACTION_REF" '
            index($0, ref) {
              suffix = substr($0, index($0, ref) + length(ref), 1)
              if (suffix == "" || suffix !~ /[[:alnum:]_.-]/) found = 1
            }
            END { exit !found }
          ' README.md

  release:
    needs: [lint, versioning, test-gitversion, test-manual-semver, validate]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
