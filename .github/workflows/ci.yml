name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      major: ${{ steps.versioning.outputs.major }}
      minor: ${{ steps.versioning.outputs.minor }}
      patch: ${{ steps.versioning.outputs.patch }}
      release-exists: ${{ steps.versioning.outputs.release-exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: versioning
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag-and-release: false

  test:
    needs: [versioning]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "version=${{ needs.versioning.outputs.version }}"
          echo "major=${{ needs.versioning.outputs.major }}"
          echo "minor=${{ needs.versioning.outputs.minor }}"
          echo "patch=${{ needs.versioning.outputs.patch }}"

  release:
    needs: [lint, versioning, test]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          semVer: ${{ needs.versioning.outputs.version }}
