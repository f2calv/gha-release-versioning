name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      major: ${{ steps.versioning.outputs.major }}
      minor: ${{ steps.versioning.outputs.minor }}
      patch: ${{ steps.versioning.outputs.patch }}
      release-exists: ${{ steps.versioning.outputs.release-exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        id: versioning
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag-and-release: false

  test:
    needs: [versioning]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "version=${{ needs.versioning.outputs.version }}"
          echo "major=${{ needs.versioning.outputs.major }}"
          echo "minor=${{ needs.versioning.outputs.minor }}"
          echo "patch=${{ needs.versioning.outputs.patch }}"

  validate:
    needs: [versioning]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: README floating major tag
        env:
          EXPECTED_ACTION_REF: ${{ github.repository }}@v${{ needs.versioning.outputs.major }}
        run: |
          awk -v ref="$EXPECTED_ACTION_REF" '
            index($0, ref) {
              suffix = substr($0, index($0, ref) + length(ref), 1)
              if (suffix == "" || suffix !~ /[[:alnum:]_.-]/) found = 1
            }
            END { exit !found }
          ' README.md

  release:
    needs: [lint, versioning, test, validate]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
